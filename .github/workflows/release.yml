name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build:all

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chrome/**
            dist/firefox/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
